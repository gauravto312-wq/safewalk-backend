spring:
  application:
    name: safewalk-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:safewalk_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2000ms
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: sos-processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.safewalk.event,com.safewalk.dto.event,com.safewalk.*"
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.safewalk: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

safewalk:
  storage:
    base-dir: ${UPLOAD_DIR:./uploads}
  upload:
    dir: ${UPLOAD_DIR:./uploads}/verification_documents
    avatar-dir: ${UPLOAD_DIR:./uploads}/avatars
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8080}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      mobile-number: ${ADMIN_BOOTSTRAP_MOBILE:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      name: ${ADMIN_BOOTSTRAP_NAME:System Administrator}
  maps:
    api-key: ${MAPS_API_KEY:}
    provider: ${MAPS_PROVIDER:google}
    connect-timeout-ms: ${MAPS_CONNECT_TIMEOUT:3000}
  kafka:
    topics:
      sos-events: ${KAFKA_SOS_EVENTS_TOPIC:sos.events}
  location:
    radius-km: ${LOCATION_RADIUS_KM:2.0}
  discovery:
    interval-ms: ${DISCOVERY_INTERVAL_MS:15000}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
