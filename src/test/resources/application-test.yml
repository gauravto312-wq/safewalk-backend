spring:
  application:
    name: safewalk-backend-test
  datasource:
    url: jdbc:h2:mem:safewalk_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sos-processing-group-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

server:
  port: 8081

safewalk:
  maps:
    api-key: test-api-key
    provider: google
    connect-timeout-ms: 1000
  kafka:
    topics:
      sos-events: sos.events
  location:
    radius-km: 2.0

jwt:
  secret: "test_only_mock_jwt_secret_key_that_is_at_least_256_bits_long_for_unit_tests_123456"
  expiration-ms: 86400000
